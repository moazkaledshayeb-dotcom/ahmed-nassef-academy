<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - أكاديمية أحمد ناصف</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; position: relative; }
        
        /* Background Slider */
        .bg-slider {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background-size: cover; background-position: center;
            animation: changeBg 20s infinite;
        }
        @keyframes changeBg {
            0% { background-image: url('https://images.unsplash.com/photo-1497633762265-9d179a990aa6?auto=format&fit=crop&w=1200&q=80'); }
            33% { background-image: url('https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=1200&q=80'); }
            66% { background-image: url('https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=1200&q=80'); }
            100% { background-image: url('https://images.unsplash.com/photo-1497633762265-9d179a990aa6?auto=format&fit=crop&w=1200&q=80'); }
        }
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); z-index: -1;
        }

        /* Container */
        .container {
            display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px;
        }
        .login-card {
            background: rgba(30, 41, 59, 0.95); padding: 30px; border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; text-align: center;
        }
        h2 { margin-bottom: 8px; color: #38bdf8; font-size: 24px; }
        .subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 24px; }
        
        .input-group { margin-bottom: 16px; text-align: right; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #cbd5e1; }
        input {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569;
            background: #0f172a; color: #fff; font-size: 14px; outline: none;
            transition: border-color 0.3s;
        }
        input:focus { border-color: #38bdf8; }
        
        .btn {
            width: 100%; padding: 12px; background: #0284c7; color: white; border: none;
            border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
            transition: background 0.3s; margin-top: 10px;
        }
        .btn:hover { background: #0369a1; }
        
        #message { margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="bg-slider"></div>
    <div class="overlay"></div>

    <div class="container">
        <div class="login-card">
            <h2>أكاديمية أحمد ناصف</h2>
            <p class="subtitle">بوابة تسجيل الدخول الموحدة</p>
            
            <form id="loginForm">
                <div class="input-group">
                    <label>اسم المستخدم أو البريد</label>
                    <input type="text" id="identifier" placeholder="أدخل اسم المستخدم..." required>
                </div>
                <div class="input-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn">دخول</button>
            </form>
            <div id="message"></div>
        </div>
    </div>

    <script>
        // إعدادات الربط بـ Supabase الخاصة بك
        const SUPABASE_URL = 'https://Sdfuhopsvsxkgqsafpey.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_FnjbFKqrH2yaGAS9pO8rYQ_jObaESib';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const identifier = document.getElementById('identifier').value.trim();
            const password = document.getElementById('password').value;
            const msg = document.getElementById('message');

            msg.style.color = '#38bdf8';
            msg.innerText = 'جاري التحقق من البيانات...';

            if (identifier === 'master_ahmed') {
                msg.style.color = '#fbbf24';
                msg.innerText = 'تنبيه: حساب مستر أحمد بحاجة للتفعيل الأول من الأدمن (معاذ شعيب).';
                return;
            }

            if (identifier === 'moaz' || identifier === 'admin') {
                msg.style.color = '#4ade80';
                msg.innerText = 'مرحباً بك يا معاذ (الأدمن)! جاري توجيهك للوحة التحكم...';
                return;
            }

            msg.style.color = '#f87171';
            msg.innerText = 'خطأ في بيانات الدخول أو الحساب غير مسجل.';
        });
    </script>
</body>
</html>
